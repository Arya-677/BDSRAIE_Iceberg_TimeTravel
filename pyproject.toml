[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttml"
version = "0.5.0"
description = "Time Travel for Reproducible ML on Apache Iceberg"
requires-python = ">=3.10"
dependencies = [
  "pyspark==3.5.3",
  "pandas>=2.0,<3",      # PySpark 3.5 predates pandas 3 (its timestamp conversion crashes); ttml avoids toPandas() anyway
  "numpy>=1.26",
  "pyyaml>=6.0",
  "lightgbm>=4.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "reportlab>=4.0",
  "setuptools>=68",      # provides `distutils`, which PySpark 3.5 imports and Python 3.12 no longer ships
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyflakes"]

[project.scripts]
ttml = "ttml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["iceberg: needs a Spark session with the Iceberg runtime jar (skipped unless TTML_ICEBERG=1)"]
filterwarnings = ["ignore::DeprecationWarning"]
