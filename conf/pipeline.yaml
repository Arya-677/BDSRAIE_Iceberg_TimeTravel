validation:                         # ingest gate thresholds (see ttml/validation.py)
  min_rows: 50
  max_null_rate: 0.05
  label_rate_min: 0.01
  label_rate_max: 0.60
  int_rate_min: 0.0
  int_rate_max: 40.0
  max_duplicate_ids: 0

table_properties:
  write_mode: copy-on-write         # copy-on-write | merge-on-read (varied in storage experiments)
  expire_max_snapshot_age_ms: 2592000000    # 30 days
  expire_min_snapshots_to_keep: 10

training:
  model_prefix: credit-lgbm
  train_end: "2015-12-31"           # time-based split (real 2012-2016 slice: train through 2015, test on 2016): issue_d <= train_end is train, later months are test
  data_filter: "1 = 1"              # extra SQL predicate applied to the pinned snapshot
  seed: 42
  artifacts_dir: artifacts
  experiment_retention_days: 90     # tier 2: tag lifetime for candidate models
  require_clean_git: false          # true: refuse to approve/deploy a model trained from uncommitted code
  release_retention_days: 2555      # tier 1: PLACEHOLDER (~7 years). Confirm the real requirement.
