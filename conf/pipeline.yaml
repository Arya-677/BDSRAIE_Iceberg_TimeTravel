    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    subsample: 1.0
    colsample_bytree: 1.0
    reg_lambda: 1.0

retention:
  routine_days: 30                  # tier 3: untagged snapshots older than this may be expired
  retain_last: 10
  orphan_days: 3                    # remove_orphan_files safety margin

