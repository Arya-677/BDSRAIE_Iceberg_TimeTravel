# Central configuration. Anything that affects training data or results lives here
# so it can be recorded in the model registry.
catalog:
  name: lake
  type: hadoop                      # hadoop | jdbc | rest (hadoop is fine for local dev)
  warehouse: ./warehouse
  iceberg_version: "1.5.2"          # PIN: must match your Spark/Scala build (iceberg-spark-runtime-3.5_2.12)
  spark_minor: "3.5"
  scala: "2.12"

tables:
  loans: lake.credit.loans
  registry: lake.ml.model_registry
  status_events: lake.ml.model_status_events
  ingest_log: lake.ml.ingest_log
  rollback_log: lake.ml.rollback_log

data:
  source_csv: data/raw/accepted_2007_to_2018Q4.csv    # or a synthetic file from `ttml gen-data`
  features_allowlist: conf/features_allowlist.txt
